<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Where to put the operator ID label on a drone</title>
  <desc>Top view of a quadcopter. The operator ID label goes on top of the main body, or inside the battery bay if it opens without tools. It does not go on the propellers, prop guards or the removable battery.</desc>
  <rect width="900" height="470" fill="#fff"/>

  <!-- arms -->
  <g stroke="#333" stroke-width="16" stroke-linecap="round">
    <line x1="255" y1="150" x2="140" y2="90"/>
    <line x1="385" y1="150" x2="500" y2="90"/>
    <line x1="255" y1="310" x2="140" y2="370"/>
    <line x1="385" y1="310" x2="500" y2="370"/>
  </g>
  <!-- rotors -->
  <g fill="#f5f5f3" stroke="#999" stroke-width="2" stroke-dasharray="6 5">
    <circle cx="140" cy="90" r="68"/>
    <circle cx="500" cy="90" r="68"/>
    <circle cx="140" cy="370" r="68"/>
    <circle cx="500" cy="370" r="68"/>
  </g>
  <g fill="#333">
    <circle cx="140" cy="90" r="12"/><circle cx="500" cy="90" r="12"/>
    <circle cx="140" cy="370" r="12"/><circle cx="500" cy="370" r="12"/>
  </g>
  <g stroke="#666" stroke-width="7" stroke-linecap="round">
    <line x1="92" y1="72" x2="188" y2="108"/><line x1="452" y1="108" x2="548" y2="72"/>
    <line x1="92" y1="388" x2="188" y2="352"/><line x1="452" y1="352" x2="548" y2="388"/>
  </g>

  <!-- removable battery, slid partly out of the back -->
  <rect x="280" y="300" width="80" height="120" rx="8" fill="#e6e6e6" stroke="#555" stroke-width="2"/>
  <text x="320" y="405" font-size="12" text-anchor="middle" fill="#555">battery</text>

  <!-- main body -->
  <rect x="235" y="110" width="170" height="230" rx="34" fill="#d9d9d9" stroke="#333" stroke-width="3"/>
  <!-- camera at the front -->
  <rect x="295" y="84" width="50" height="34" rx="8" fill="#333"/>
  <circle cx="320" cy="98" r="9" fill="#777"/>
  <text x="320" y="72" font-size="13" text-anchor="middle" fill="#555">front</text>

  <!-- label on top of the body -->
  <rect x="252" y="160" width="136" height="46" rx="6" fill="#fff" stroke="#111" stroke-width="2"/>
  <rect x="252" y="160" width="136" height="14" rx="6" fill="#111"/>
  <rect x="252" y="168" width="136" height="6" fill="#111"/>
  <text x="258" y="171" font-size="8" font-weight="700" fill="#fff">OPERATOR ID</text>
  <text x="320" y="197" font-size="15" font-weight="700" text-anchor="middle" font-family="ui-monospace, 'DejaVu Sans Mono', monospace" fill="#111">GBR-OP-…</text>

  <!-- battery bay inside the back of the body, with a small label on its wall -->
  <rect x="272" y="236" width="96" height="96" rx="6" fill="#bdbdbd" stroke="#333" stroke-width="2" stroke-dasharray="5 4"/>
  <rect x="282" y="246" width="76" height="24" rx="3" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="320" y="262" font-size="9" font-weight="700" text-anchor="middle" font-family="ui-monospace, 'DejaVu Sans Mono', monospace" fill="#111">GBR-OP-…</text>

  <!-- callouts -->
  <g stroke-width="2" fill="none">
    <polyline points="388,183 560,183 590,150" stroke="#1e7a3b"/>
    <polyline points="358,258 560,258 590,265" stroke="#1e7a3b"/>
    <polyline points="548,72 590,48" stroke="#b3261e"/>
    <polyline points="360,400 590,400" stroke="#b3261e"/>
  </g>
  <g font-size="17">
    <circle cx="610" cy="44" r="13" fill="#b3261e"/>
    <path d="M604 38 L616 50 M616 38 L604 50" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <text x="632" y="42" font-weight="700" fill="#111">Not on propellers</text>
    <text x="632" y="63" fill="#555">or prop guards</text>

    <circle cx="610" cy="146" r="13" fill="#1e7a3b"/>
    <path d="M603 146 L608 152 L617 140" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="632" y="144" font-weight="700" fill="#111">Top of the main body</text>
    <text x="632" y="165" fill="#555">visible from outside</text>

    <circle cx="610" cy="266" r="13" fill="#1e7a3b"/>
    <path d="M603 266 L608 272 L617 260" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="632" y="264" font-weight="700" fill="#111">Or inside the battery bay</text>
    <text x="632" y="285" fill="#555">if it opens without tools</text>

    <circle cx="610" cy="400" r="13" fill="#b3261e"/>
    <path d="M604 394 L616 406 M616 394 L604 406" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <text x="632" y="398" font-weight="700" fill="#111">Not on the battery</text>
    <text x="632" y="419" fill="#555">it comes off the drone</text>
  </g>
</svg>
